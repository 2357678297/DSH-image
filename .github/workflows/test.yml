name: test

# 每次「更新包」推上来都跑一遍离线测试（不需要网络、不需要 Chrome）。
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 宿主半边（HTTP / 任务队列 / 配置）
        run: node test/host.test.mjs
      - name: 浏览器半边（源码断言与渲染结构）
        run: node test/client.test.mjs
      - name: 客户端引擎（最小 React 环境跑 hook）
        run: node test/engine.test.mjs
